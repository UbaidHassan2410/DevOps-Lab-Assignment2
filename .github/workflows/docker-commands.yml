name: Docker Commands

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE: bse_26_commands
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Docker build
        run: docker build -t "$DOCKERHUB_USERNAME/$IMAGE:latest" .

      - name: Docker push
        run: docker push "$DOCKERHUB_USERNAME/$IMAGE:latest"